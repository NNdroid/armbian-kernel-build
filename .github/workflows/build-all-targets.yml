name: Build all targets (scheduled)

# The unattended run. It builds every declared target, each on the runner its
# own profile asks for, and it discovers them with `build.sh --list-targets
# --json` rather than a list written here. Adding a target is therefore a
# profile-only change: the matrix picks it up on the next run with no edit to
# this file, which is the same rule the manual workflow follows.
#
# Manual one-off builds live in build.yml.
on:
  schedule:
    # 13:10 UTC. Off the hour on purpose: the top of the hour is when every other
    # scheduled workflow on the platform tries to start at once.
    - cron: '10 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the upstream version was already released
        type: boolean
        default: false

concurrency:
  group: build-all-targets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    name: Resolve target matrix
    runs-on: ubuntu-24.04
    # Fail fast instead of hanging on a stuck network call or a wedged resolver.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve every target and its runner
        id: targets
        run: |
          set -Eeuo pipefail
          bash build.sh --check-targets
          # Validate the shape here rather than letting a malformed matrix reach
          # the build job, where a runner that cannot be resolved fails with a
          # message that says nothing about which profile is at fault.
          matrix="$(bash build.sh --list-targets --json)"
          printf '%s\n' "${matrix}"
          case "${matrix}" in
            '{"include":[]}'|'') echo "::error::No target profiles were found."; exit 1 ;;
          esac
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"

  verify:
    name: Verify injection and contracts
    needs: discover
    runs-on: ubuntu-24.04
    # The injection suite compiles nothing but downloads pinned sources and
    # replays the wrapper against a synthetic tree; on a loaded runner it runs
    # well inside the build job's ceiling, and it has to finish before any build
    # starts so a broken injection path never costs six hours of compile time.
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl

      - name: Make script executable
        run: chmod +x build.sh overwrite/build_with_diy.sh tests/test_kernel_injection.sh

      # One run of the suite, shared by every matrix leg. These tests exercise
      # the shared injection, logging and packaging code rather than anything
      # specific to one board, so running them per leg would multiply the cost
      # without adding coverage. The build legs still fail on their own: a
      # profile that loads here can still fail to build.
      - name: Run regression tests
        run: |
          set -Eeuo pipefail
          bash tests/test_kernel_injection.sh
          python3 tests/test_live_log_server.py
          python3 tests/test_hk1box.py
          python3 tests/test_redact_log_stream.py
          # The logging contract: level gating, the step banners live_dashboard.py
          # parses, and the failure report. It is a contract with the dashboard
          # and with log files left behind by CI, so it has to gate merges rather
          # than only run locally.
          python3 tests/test_logging.py

      - name: Verify current Armbian extension integration
        env:
          # Pinned so an upstream refactor cannot silently redefine the extension
          # contract this repository is tested against. Bump deliberately after
          # checking that lib/functions/general/extensions.sh still exposes the
          # hook points used by userpatches/extensions/*.sh.
          ARMBIAN_BUILD_REF: ec48552082d5ceeb9b01e33182ee1b3b6daff105
        run: |
          set -Eeuo pipefail
          manager_source="$(mktemp)"
          trap 'rm -f -- "$manager_source"' EXIT
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            "https://raw.githubusercontent.com/armbian/build/${ARMBIAN_BUILD_REF}/lib/functions/general/extensions.sh" \
            --output "$manager_source"
          bash tests/test_armbian_extensions.sh "$manager_source"

  build:
    name: Build ${{ matrix.target }}
    needs: [discover, verify]
    runs-on: ${{ matrix.runner }}
    # A full Armbian kernel build is long. Declare the ceiling explicitly so a
    # hung compile fails with this reason instead of the silent 360-minute
    # platform default, and leave headroom for packaging and upload.
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          preinstalled-runtimes: true
          swap-storage: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl sudo qemu-user-static gh

      - name: Make script executable
        run: chmod +x build.sh overwrite/build_with_diy.sh

      - name: Run build script
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TARGET: ${{ matrix.target }}
          # auto builds every branch the profile declares, so a new branch in a
          # profile is picked up without touching this file.
          BUILD_BRANCH: auto
          # A scheduled run has no interactive operator, so there is nobody to
          # answer a prompt with; a manual re-run of this workflow can force.
          BUILD_FORCE: ${{ inputs.force && 'yes' || 'no' }}
          BUILD_PUBLISH: 'yes'
        run: |
          set -Eeuo pipefail
          # Release tags are prefixed per target (hk1box- for HK1 Box, bare for
          # Rockchip64), so parallel legs write to different tags and cannot
          # clobber each other's Release. Record the resolved profile in the log
          # so a failed run says which Release it meant to write.
          echo "Target: ${{ matrix.target }} (board ${{ matrix.board }}, family ${{ matrix.family }})"
          log="build-${{ matrix.target }}.log"
          : > "${log}"

          # Redaction is not optional here. The raw stream can contain values
          # from the environment, and this log is uploaded as an artifact and
          # echoed into the job output, so it has to pass through the redactor
          # on its way to both. 2>&1 because the build writes its whole log to
          # stderr by design -- one stream, so the redaction cannot interleave
          # out of order with the lines around it.
          set +e
          ./build.sh 2>&1 \
            | python3 -u scripts/redact_log_stream.py \
            | tee -a "${log}"
          pipeline_status=("${PIPESTATUS[@]}")
          build_exit_code=${pipeline_status[0]}
          redact_exit_code=${pipeline_status[1]}
          tee_exit_code=${pipeline_status[2]}
          set -e

          # A redactor or tee that dies mid-stream leaves a truncated log that
          # looks like a short build. Fail loudly rather than report success on
          # a partial record.
          if (( redact_exit_code != 0 )); then
            echo "::error::Log redaction failed; the recorded build log is incomplete."
            exit "${redact_exit_code}"
          fi
          if (( tee_exit_code != 0 )); then
            echo "::error::Writing the build log failed; treating the run as failed."
            exit "${tee_exit_code}"
          fi
          exit "${build_exit_code}"

      - name: Upload build log and artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output-${{ matrix.target }}
          path: |
            build-${{ matrix.target }}.log
            build/output/debs/*
            # Every adapter writes its bundle under build/output/<target>/. The
            # exclusion keeps the metadata directory from matching twice.
            build/output/*/
            !build/output/release-metadata/
            build/output/release-metadata/**
          if-no-files-found: ignore
          retention-days: 5
