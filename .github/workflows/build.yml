name: Build (manual)

# Manual builds only. The unattended run lives in build-all-targets.yml, which
# builds every declared target on a schedule. Keeping them apart means a
# maintainer can rebuild one target at an arbitrary time without queuing behind
# -- or being cancelled by -- the scheduled matrix.
on:
  workflow_dispatch:
    inputs:
      target:
        # A free-form string on purpose: adding a target must not require editing
        # this workflow. `bash build.sh --list-targets` shows the valid ids, and
        # an unknown one fails in the prepare step before any runner is started.
        description: 'Build platform; run `bash build.sh --list-targets` for valid ids'
        type: string
        default: rockchip64
      branch:
        description: Branch to build (auto builds every branch the target declares)
        type: choice
        default: auto
        options:
          - auto
          - current
          - edge
          - bleedingedge
      force:
        description: Build even when the upstream version was already released
        type: boolean
        default: false
      publish:
        description: Publish validated packages and metadata to Release
        type: boolean
        default: true

concurrency:
  group: build-manual-${{ inputs.target || 'rockchip64' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve target profile
    runs-on: ubuntu-24.04
    # Fail fast instead of hanging on a stuck network call or a wedged resolver.
    timeout-minutes: 10
    outputs:
      runner: ${{ steps.target.outputs.runner }}
      board: ${{ steps.target.outputs.board }}
      family: ${{ steps.target.outputs.family }}
      arch: ${{ steps.target.outputs.arch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate target and select runner
        id: target
        env:
          BUILD_TARGET: ${{ inputs.target }}
          BUILD_BRANCH: ${{ inputs.branch }}
        run: bash build.sh --describe-target >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ inputs.target || 'rockchip64' }}
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.runner }}
    # A full Armbian kernel build is long. Declare the ceiling explicitly so a
    # hung compile fails with this reason instead of the silent 360-minute
    # platform default, and leave headroom for packaging and upload.
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          preinstalled-runtimes: true
          swap-storage: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl sudo qemu-user-static gh

      - name: Make script executable
        run: chmod +x build.sh overwrite/build_with_diy.sh tests/test_kernel_injection.sh

      - name: Test kernel source injection
        run: |
          bash tests/test_kernel_injection.sh
          python3 tests/test_live_log_server.py
          python3 tests/test_hk1box.py
          python3 tests/test_redact_log_stream.py
          # The logging contract: level gating, the step banners live_dashboard.py
          # parses, and the failure report. It is a contract with the dashboard
          # and with log files left behind by CI, so it has to gate merges rather
          # than only run locally.
          python3 tests/test_logging.py

      - name: Verify current Armbian extension integration
        env:
          # Pinned so an upstream refactor cannot silently redefine the extension
          # contract this repository is tested against. Bump deliberately after
          # checking that lib/functions/general/extensions.sh still exposes the
          # hook points used by userpatches/extensions/*.sh.
          ARMBIAN_BUILD_REF: ec48552082d5ceeb9b01e33182ee1b3b6daff105
        run: |
          set -Eeuo pipefail
          manager_source="$(mktemp)"
          trap 'rm -f -- "$manager_source"' EXIT
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            "https://raw.githubusercontent.com/armbian/build/${ARMBIAN_BUILD_REF}/lib/functions/general/extensions.sh" \
            --output "$manager_source"
          bash tests/test_armbian_extensions.sh "$manager_source"

      - name: Start authenticated ngrok live log
        continue-on-error: true
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          LIVE_LOG_AUTH: ${{ secrets.NGROK_LOG_AUTH }}
          CONFIGURED_NGROK_URL: ${{ secrets.NGROK_URL }}
          LIVE_LOG_BOARD: ${{ needs.prepare.outputs.board }}
          LIVE_LOG_FAMILY: ${{ needs.prepare.outputs.family }}
          LIVE_LOG_ARCH: ${{ needs.prepare.outputs.arch }}
        run: |
          set -Eeuo pipefail

          live_dir="${RUNNER_TEMP}/kernel-live-log"
          mkdir -p "${live_dir}"
          : > "${live_dir}/build.log"
          printf '{"state":"starting"}\n' > "${live_dir}/status.json"

          if [[ -z "${NGROK_AUTHTOKEN}" || -z "${LIVE_LOG_AUTH}" || -z "${CONFIGURED_NGROK_URL}" ]]; then
            echo "::warning title=Live build log disabled::Configure NGROK_AUTHTOKEN, NGROK_LOG_AUTH, and NGROK_URL repository secrets to enable it."
            printf '{"state":"disabled"}\n' > "${live_dir}/status.json"
            exit 0
          fi

          log_username="${LIVE_LOG_AUTH%%:*}"
          log_password="${LIVE_LOG_AUTH#*:}"
          if [[ "${LIVE_LOG_AUTH}" != *:* || -z "${log_username}" || -z "${log_password}" ]]; then
            echo "::warning title=Live build log disabled::NGROK_LOG_AUTH must contain a non-empty username and password in username:password format."
            printf '{"state":"disabled"}\n' > "${live_dir}/status.json"
            exit 0
          fi

          if [[ "${CONFIGURED_NGROK_URL}" != https://* || "${CONFIGURED_NGROK_URL}" == *$'\n'* ]]; then
            echo "::warning title=Live build log disabled::NGROK_URL must be one HTTPS URL without line breaks."
            printf '{"state":"disabled"}\n' > "${live_dir}/status.json"
            exit 0
          fi

          curl -fsSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            -o "${RUNNER_TEMP}/ngrok.asc"
          sudo install -m 0644 "${RUNNER_TEMP}/ngrok.asc" /etc/apt/trusted.gpg.d/ngrok.asc
          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y ngrok

          nohup env LIVE_LOG_AUTH="${LIVE_LOG_AUTH}" \
            LIVE_LOG_BOARD="${LIVE_LOG_BOARD}" \
            LIVE_LOG_ARCH="${LIVE_LOG_ARCH}" \
            LIVE_LOG_FAMILY="${LIVE_LOG_FAMILY}" \
            LIVE_LOG_RELEASE="trixie" \
            python3 scripts/live_log_server.py \
              --directory "${live_dir}" \
              --files-directory "${GITHUB_WORKSPACE}/build/output" \
              --host 127.0.0.1 \
              --port 8080 \
            > "${live_dir}/http-server.log" 2>&1 &
          echo "$!" > "${live_dir}/http-server.pid"

          server_ready=false
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              server_ready=true
              break
            fi
            sleep 1
          done
          if [[ "${server_ready}" != true ]]; then
            echo "::error title=Live log server failed::The local authenticated HTTP server did not become ready."
            sed -n '1,120p' "${live_dir}/http-server.log" || true
            exit 1
          fi

          live_url="${CONFIGURED_NGROK_URL}"
          live_url="${live_url%/}"
          nohup ngrok http 8080 \
            --url "${live_url}" \
            --authtoken "${NGROK_AUTHTOKEN}" \
            --log stdout \
            > "${live_dir}/ngrok.log" 2>&1 &
          echo "$!" > "${live_dir}/ngrok.pid"

          tunnel_ready=false
          for _ in {1..45}; do
            if curl -fsS "${live_url}/healthz" >/dev/null; then
              tunnel_ready=true
              break
            fi
            sleep 1
          done
          if [[ "${tunnel_ready}" != true ]]; then
            echo "::error title=ngrok tunnel failed::The configured ngrok URL did not become reachable."
            sed -n '1,160p' "${live_dir}/ngrok.log" || true
            exit 1
          fi

          echo "::notice title=Live build log::The authenticated endpoint configured by the NGROK_URL repository secret is ready."
          {
            echo "### Live build log"
            echo
            echo "The authenticated endpoint configured by the \`NGROK_URL\` repository secret is ready."
            echo "It exists only while the build job is running."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run build script
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TARGET: ${{ inputs.target }}
          BUILD_BRANCH: ${{ inputs.branch }}
          BUILD_FORCE: ${{ inputs.force && 'yes' || 'no' }}
          # This workflow only ever runs on workflow_dispatch, so the input is
          # the whole decision. The scheduled workflow has no such input and
          # always publishes.
          BUILD_PUBLISH: ${{ inputs.publish && 'yes' || 'no' }}
        run: |
          set -Eeuo pipefail
          live_dir="${RUNNER_TEMP}/kernel-live-log"
          mkdir -p "${live_dir}"
          printf '{"state":"running"}\n' > "${live_dir}/status.json"

          set +e
          ./build.sh 2>&1 \
            | python3 -u scripts/redact_log_stream.py \
            | tee "${live_dir}/build.log"
          pipeline_status=("${PIPESTATUS[@]}")
          build_exit_code=${pipeline_status[0]}
          redact_exit_code=${pipeline_status[1]}
          tee_exit_code=${pipeline_status[2]}
          set -e

          if (( build_exit_code == 0 && redact_exit_code == 0 && tee_exit_code == 0 )); then
            build_state=success
          else
            build_state=failure
          fi
          effective_exit_code=${build_exit_code}
          if (( effective_exit_code == 0 && redact_exit_code != 0 )); then
            effective_exit_code=${redact_exit_code}
          fi
          if (( effective_exit_code == 0 && tee_exit_code != 0 )); then
            effective_exit_code=${tee_exit_code}
          fi
          printf '{"state":"%s","exit_code":%d}\n' \
            "${build_state}" "${effective_exit_code}" > "${live_dir}/status.json"
          exit "${effective_exit_code}"

      - name: Upload Artifacts Backup
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-images-${{ inputs.target }}
          path: |
            build/output/debs/*
            # Every adapter writes its bundle under build/output/<target>/.
            # Naming hk1box literally used to mean a rockchip64 run silently
            # uploaded no bundle at all; the exclusion keeps the metadata
            # directory below from being collected twice under two patterns.
            build/output/*/
            !build/output/release-metadata/
            build/output/release-metadata/**
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload sanitized build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diagnostics
          path: |
            ${{ runner.temp }}/kernel-live-log/build.log
            ${{ runner.temp }}/kernel-live-log/status.json
          if-no-files-found: ignore
          retention-days: 5

      - name: Stop live build log endpoint
        if: always()
        run: |
          live_dir="${RUNNER_TEMP}/kernel-live-log"
          for pid_file in "${live_dir}/ngrok.pid" "${live_dir}/http-server.pid"; do
            if [[ -s "${pid_file}" ]]; then
              kill "$(cat "${pid_file}")" 2>/dev/null || true
            fi
          done
