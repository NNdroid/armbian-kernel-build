# HK1 Box / Vontar X3: kernel-only adaptation for the existing Amlogic boot chain.
# The meson64-7.2 patch set provides the Ophub-compatible ARM64 Image
# TEXT_OFFSET; this target intentionally does not build or flash U-Boot.
BOARD_NAME="HK1 Box / Vontar X3"
BOARD_VENDOR="amlogic"
BOARDFAMILY="meson-sm1"
KERNEL_TARGET="edge"
BOOT_FDT_FILE="amlogic/meson-sm1-hk1box-vontar-x3.dtb"
SERIALCON="ttyAML0"
BOOTCONFIG="none"

function post_family_config__hk1box_kernel_only() {
    [[ "${chosen_artifact:-}" == kernel ]] || {
        display_alert "HK1 Box" "Only kernel builds are supported; existing U-Boot must be retained" "err"
        return 1
    }
    unset BOOTSOURCE
    BOOTCONFIG="none"
}

function custom_kernel_config__999_hk1box_storage_and_network() {
    # Root storage, initramfs decompression and networking must not depend on
    # an externally loaded .ko during early boot.
    local -A TARGET_SERIES=()
    source "${USERPATCHES_PATH}/config/build-targets/hk1box.conf"
    local symbol defined_symbols
    # Fail before spending an hour compiling if a profile names a removed or
    # misspelled Kconfig symbol. Driver filenames need not match symbol names.
    if [[ -f .config ]]; then
        defined_symbols="$(_kernel_inject_scan_defined_symbols "$PWD")" || return 1
        for symbol in "${TARGET_REQUIRED_Y[@]}"; do
            grep -qx "${symbol}" <<< "${defined_symbols}" || {
                _kernel_inject_log err "Unknown board Kconfig symbol" \
                    "CONFIG_${symbol} is not defined by this kernel; update the hk1box profile before compiling"
                return 1
            }
        done
    fi
    for symbol in "${TARGET_REQUIRED_Y[@]}"; do
        # Armbian applies opts_m after opts_y. Remove earlier conflicting
        # requests (including CONFIG_-prefixed spellings) before forcing y.
        _kernel_inject_force_mode "${symbol}" y || return 1
        kernel_config_modifying_hashes+=("hk1box-required=${symbol}=y")
    done
    kernel_config_modifying_hashes+=("hk1box-boot-drivers-v3")
}
