# HK1 Box / Vontar X3: kernel-only adaptation for existing vendor U-Boot.
BOARD_NAME="HK1 Box / Vontar X3"
BOARD_VENDOR="amlogic"
BOARDFAMILY="meson-sm1"
KERNEL_TARGET="edge"
BOOT_FDT_FILE="amlogic/meson-sm1-hk1box-vontar-x3.dtb"
SERIALCON="ttyAML0"
BOOTCONFIG="none"

function post_family_config__hk1box_kernel_only() {
    [[ "${chosen_artifact:-}" == kernel ]] || {
        display_alert "HK1 Box" "Only kernel builds are supported; existing U-Boot must be retained" "err"
        return 1
    }
    unset BOOTSOURCE
    BOOTCONFIG="none"
}

function custom_kernel_config__hk1box_storage_and_network() {
    # Root storage and networking must not depend on an externally loaded .ko.
    local -A TARGET_SERIES=()
    source "${USERPATCHES_PATH}/config/build-targets/hk1box.conf"
    opts_y+=("${TARGET_REQUIRED_Y[@]}")
}
