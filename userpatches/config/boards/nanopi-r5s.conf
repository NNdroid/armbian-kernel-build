# Armbian requires a board file at this conventional path and sources it by
# board id. All configuration lives in the target profile; do not add any here
# or it will silently drift from the profile.
#
# This board is the one the rockchip64 target builds. It needs no adaptation, so
# the profile declares no Armbian board variables and no hooks.
_target_profile="${USERPATCHES_PATH}/config/build-targets/rockchip64.conf"
if [[ ! -f "${_target_profile}" ]]; then
    printf '[ERROR] Board %s has no target profile: %s\n' "${BASH_SOURCE[0]##*/}" "${_target_profile}" >&2
    return 1 2>/dev/null || exit 1
fi
# shellcheck disable=SC1090
source "${_target_profile}"
unset _target_profile
