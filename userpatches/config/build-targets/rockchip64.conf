# Rockchip64 / nanopi-r5s: plain Armbian DEB distribution.
#
# This target needs no board-specific adaptation, so it selects the "deb"
# adapter (a no-op passthrough) and declares no DTB or built-in driver
# requirements. Only the fields the schema marks required are set; everything
# else falls back to the schema default.
TARGET_BOARD=nanopi-r5s
TARGET_FAMILY=rockchip64
TARGET_ARCH=arm64
TARGET_KBUILD_ARCH=arm64
TARGET_RUNNER=ubuntu-24.04
TARGET_VERSION_CONFIG=include/rockchip64_common.inc
TARGET_ADAPTER=deb
TARGET_BRANCHES=(current edge bleedingedge)
