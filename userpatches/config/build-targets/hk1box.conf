# Kernel-only profile for an existing ophub HK1 Box boot chain.
TARGET_BOARD=hk1box
TARGET_FAMILY=meson64
TARGET_ARCH=arm64
TARGET_KBUILD_ARCH=arm64
TARGET_RUNNER=ubuntu-24.04-arm
TARGET_VERSION_CONFIG=include/meson64_common.inc
TARGET_RELEASE_PREFIX=hk1box-
TARGET_ADAPTER=ophub-tar
TARGET_BRANCHES=(edge)
TARGET_SERIES=([edge]=7.2)
TARGET_BOARD_DTB=amlogic/meson-sm1-hk1box-vontar-x3.dtb
# Keep the SM1 platform providers and UART available before initramfs/modules.
# Storage and USB consumers need these clocks, pins, interrupts and power domains.
TARGET_REQUIRED_Y=(ARCH_MESON ARM64_4K_PAGES ARM_PSCI_FW MESON_SM
    COMMON_CLK_G12A PINCTRL_MESON_G12A MESON_IRQ_GPIO MESON_EE_PM_DOMAINS
    SERIAL_MESON SERIAL_MESON_CONSOLE
    MMC MMC_BLOCK MMC_MESON_GX PWRSEQ_EMMC PWRSEQ_SIMPLE
    BLK_DEV_INITRD RD_GZIP EXT4_FS
    REGULATOR_FIXED_VOLTAGE REGULATOR_PWM PWM_MESON
    STMMAC_ETH STMMAC_PLATFORM DWMAC_MESON REALTEK_PHY
    USB_DWC3 USB_DWC3_MESON_G12A USB_XHCI_HCD USB_XHCI_PLATFORM
    PHY_MESON_G12A_USB2 PHY_MESON_G12A_USB3_PCIE)
