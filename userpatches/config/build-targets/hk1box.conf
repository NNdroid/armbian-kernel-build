# HK1 Box / Vontar X3: kernel-only adaptation for an existing Amlogic boot chain.
#
# This is the single source of truth for the target. Everything -- build
# identity, kernel series lock, DTB, built-in driver requirements, Armbian board
# variables and the custom_kernel_config hook -- lives in this one file.
# userpatches/config/boards/hk1box.conf is a one-line shim that sources it,
# because Armbian requires a board file at that conventional path.
#
# Adding a target means copying this file, changing the values, and deleting
# whatever hook functions the new board does not need.

# --- Build identity -------------------------------------------------------
TARGET_BOARD=hk1box
TARGET_FAMILY=meson64
TARGET_ARCH=arm64
TARGET_KBUILD_ARCH=arm64
TARGET_RUNNER=ubuntu-24.04-arm
TARGET_VERSION_CONFIG=include/meson64_common.inc
TARGET_RELEASE_PREFIX=hk1box-
TARGET_ADAPTER=ophub-tar
TARGET_BRANCHES=(edge)

# The series lock. A bare TARGET_SERIES=([edge]=7.2) literal makes bash parse
# [edge] as an arithmetic subscript, which fails with "edge: unbound variable"
# under `set -u`; quoting does not help because the quotes become part of the
# subscript. Assign into a declared map instead. Leaving the field unset (as
# rockchip64 does) means "track Armbian", which the schema allows.
declare -gA TARGET_SERIES=()
TARGET_SERIES["edge"]=7.2

TARGET_BOARD_DTB=amlogic/meson-sm1-hk1box-vontar-x3.dtb

# --- Boot contract checked against the built artifacts -------------------
# HK1 Box uses a legacy Amlogic boot flow. Ophub/unifreq kernels advertise
# 0x01080000 in the ARM64 Image header so vendor U-Boot can boot the Image
# without requiring a u-boot.ext overload solely to compensate for offset 0.
# These values are data, not code: the ophub-tar packaging validates whatever
# is declared here and skips the rest, so a similar board is profile-only.
TARGET_BOOT_TEXT_OFFSET=01080000
# mmc0/1/2 must resolve to these controllers, in this order.
TARGET_DTB_MMC_ALIASES=(ffe03000 ffe05000 ffe07000)
# 4 GB at physical address 0.
TARGET_DTB_MEMORY_REG='0 0 0 ffffffff'

# Keep the SM1 platform providers and UART available before initramfs/modules.
# Storage and USB consumers need these clocks, pins, interrupts and power domains.
TARGET_REQUIRED_Y=(ARCH_MESON ARM64_4K_PAGES ARCH_PSCI_FW MESON_SM
    COMMON_CLK_G12A PINCTRL_MESON_G12A MESON_IRQ_GPIO MESON_EE_PM_DOMAINS
    SERIAL_MESON SERIAL_MESON_CONSOLE
    MMC MMC_BLOCK MMC_MESON_GX PWRSEQ_EMMC PWRSEQ_SIMPLE
    BLK_DEV_INITRD RD_GZIP EXT4_FS
    REGULATOR_FIXED_VOLTAGE REGULATOR_PWM PWM_MESON
    STMMAC_ETH STMMAC_PLATFORM DWMAC_MESON REALTEK_PHY
    USB_DWC3 USB_DWC3_MESON_G12A USB_XHCI_HCD USB_XHCI_PLATFORM
    PHY_MESON_G12A_USB2 PHY_MESON_G12A_USB3_PCIE)

# --- Armbian board variables ---------------------------------------------
# The meson64-7.2 patch set provides the Ophub-compatible ARM64 Image
# TEXT_OFFSET; this target intentionally does not build or flash U-Boot.
BOARD_NAME="HK1 Box / Vontar X3"
BOARD_VENDOR=amlogic
BOARDFAMILY=meson-sm1
KERNEL_TARGET=edge
BOOT_FDT_FILE=amlogic/meson-sm1-hk1box-vontar-x3.dtb
SERIALCON=ttyAML0
BOOTCONFIG=none

# --- Armbian hooks --------------------------------------------------------
# Both hooks are optional. A target that needs no family-level tweak simply
# omits post_family_config__; a target with no extra built-in requirements omits
# custom_kernel_config__. Nothing else has to be edited when adding a board.

function post_family_config__hk1box_kernel_only() {
    [[ "${chosen_artifact:-}" == kernel ]] || {
        display_alert "HK1 Box" "Only kernel builds are supported; existing U-Boot must be retained" "err"
        return 1
    }
    unset BOOTSOURCE
    BOOTCONFIG=none
}

function custom_kernel_config__999_hk1box_storage_and_network() {
    # Do NOT declare TARGET_SERIES (or any other profile field) as a local
    # before use: bash would bind a profile assignment to that local and
    # silently drop the profile's own value.
    local symbol defined_symbols
    # Fail before spending an hour compiling if the profile names a removed or
    # misspelled Kconfig symbol. Driver filenames need not match symbol names.
    if [[ -f .config ]]; then
        defined_symbols="$(_kernel_inject_scan_defined_symbols "$PWD")" || return 1
        for symbol in "${TARGET_REQUIRED_Y[@]}"; do
            if ! grep -qx "${symbol}" <<< "${defined_symbols}"; then
                _kernel_inject_log err "Unknown board Kconfig symbol" \
                    "CONFIG_${symbol} is not defined by this kernel; update the hk1box profile before compiling"
                return 1
            fi
        done
    fi
    for symbol in "${TARGET_REQUIRED_Y[@]}"; do
        # Armbian applies opts_m after opts_y. Remove earlier conflicting
        # requests (including CONFIG_-prefixed spellings) before forcing y.
        _kernel_inject_force_mode "${symbol}" y || return 1
        kernel_config_modifying_hashes+=("hk1box-required=${symbol}=y")
    done
    kernel_config_modifying_hashes+=("hk1box-boot-drivers-v4")
}
